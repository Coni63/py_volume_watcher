name: Python package

on:
  - push
  - pull_request

jobs:
  test:
    runs-on:
      - ubuntu-latest
      # - windows-latest
      # - macos-latest
    strategy:
      matrix:
        python-version:
          # - "pypy3.10"
          - "3.9"
          # - "3.10"
          # - "3.11"
          # - "3.12"

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install pytest
      - name: Run tests
        run: pytest .
